# DIAG #1364 -- do not merge. Fresh-account cold Windows PowerShell ACL probe evidence (E1-E5).
name: diag-1364
on:
  pull_request:
    paths:
      - .github/workflows/diag-1364.yml
      - .github/diag-1364/**
      - packages/keys/src/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: diag-1364 ${{ matrix.arm }} #${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, complete, killtree]
        rep: [1, 2, 3, 4, 5]
        include:
          - { arm: baseline, rep: 6 }
          - { arm: baseline, rep: 7 }
          - { arm: baseline, rep: 8 }
          - { arm: baseline, rep: 9 }
          - { arm: baseline, rep: 10 }
          - { arm: baseline, rep: 11 }
          - { arm: baseline, rep: 12 }
          - { arm: baseline, rep: 13 }
          - { arm: baseline, rep: 14 }
          - { arm: baseline, rep: 15 }
          - { arm: baseline, rep: 16 }
          - { arm: baseline, rep: 17 }
          - { arm: baseline, rep: 18 }
          - { arm: baseline, rep: 19 }
          - { arm: baseline, rep: 20 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun ci
      - name: Probe under a freshly created non-administrator account
        shell: pwsh
        env:
          BYOK_DIAG_ARM: ${{ matrix.arm }}
          BYOK_DIAG_REP: ${{ matrix.rep }}
        run: ./.github/diag-1364/admin.ps1
