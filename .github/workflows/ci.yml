name: Bounded Windows writer handoff diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Baseline then candidate, two files once
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
        with:
          ref: 12a11bcfa8c711587c91f830d29457937a8d0ae9
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 21c935b7bfae1d5d7161beb956167b9650b96160
          path: candidate
          persist-credentials: false
      - name: Compare exact sources once
        run: node diagnostic/scripts/diagnostics/writer-handoff-640.mjs baseline candidate
