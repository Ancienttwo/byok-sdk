name: Bounded Windows scheduling diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Exact baseline and candidate, one scheduling case each
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
        with:
          ref: 1e5326eb38a3476d1a69733a43a5adb3526eba45
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 64e102f4f9693c487afb71f9472dc4816faeee17
          path: candidate
          persist-credentials: false
      - name: Validate pinned sources and CRLF anchors without mutation
        run: node diagnostic/scripts/diagnostics/scheduling-669.mjs --check baseline candidate
      - name: Run scheduling case once per source
        run: node diagnostic/scripts/diagnostics/scheduling-669.mjs baseline candidate
