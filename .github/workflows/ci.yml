name: Bounded Windows coalesce diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Candidate barrier and S5 once
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
        with:
          ref: c0fae66071f1633874fc89ad961459a360855b60
          path: candidate
          persist-credentials: false
      - name: Candidate barrier and S5 once
        run: node diagnostic/scripts/diagnostics/coalesce-667.mjs candidate candidate
