name: CI

# Temporary probe branch (train/probe-macos-hang). Never merged.
# Reproduces the macOS hang in the agent memory helper job's step
# "Run SDK helper, intent and capability contracts" with that step in its own
# process group and a ps sampler outside it.
on:
  pull_request:

concurrency:
  group: probe-macos-hang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: macOS helper step 15 probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Install dependencies
        run: bun ci

      - name: Build needed packages
        run: bun run build

      - name: Build and verify SDK helper release assets
        run: bun run --filter @byok-sdk/client build:agent-memory-helper

      # The sampler runs outside the test's process group, so a signal sent to
      # that group cannot stop it.
      - name: Run SDK helper, intent and capability contracts (own process group)
        timeout-minutes: 10
        run: |
          (while :; do
             echo "=== $(date -u +%T)"
             ps -axo pid,pgid,ppid,stat,etime,command | cut -c1-300
             sleep 10
           done) > "$RUNNER_TEMP/probe-ps.log" 2>&1 &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          echo "step shell pid=$$ pgid=$(ps -o pgid= -p $$)"
          perl -e 'setpgrp(0,0); exec @ARGV' bun run --filter @byok-sdk/client test -- --reporter=verbose --reporter=hanging-process src/__tests__/agent-memory-fs-helper.test.ts src/__tests__/agent-memory-helper-release.test.ts src/__tests__/agent-memory-helper-assets.test.ts src/__tests__/agent-memory-helper-asset-root-daemon.test.ts src/__tests__/agent-memory-helper-release-errors.test.ts src/__tests__/agent-memory-helper-admission.test.ts src/__tests__/agent-memory-mcp-admission.test.ts src/__tests__/agent-memory-helper-crash.test.ts src/__tests__/agent-memory-intent.test.ts src/__tests__/daemon-conn-hello-capabilities.test.ts src/__tests__/agent-home-directory-barrier.test.ts src/__tests__/agent-memory-helper-identity.test.ts src/__tests__/agent-memory-windows-gate.test.ts

      - name: Show the ps samples
        if: always()
        run: |
          cat "$RUNNER_TEMP/probe-ps.log" || true
          echo "=== processes in T (stopped) state now"
          ps -axo pid,pgid,ppid,stat,etime,command | awk 'NR==1 || $4 ~ /T/' | cut -c1-300
