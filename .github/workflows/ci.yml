name: Bounded Windows acceptance diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Exact baseline and candidate, two sequential acceptance cases each
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/checkout@v7
        with:
          ref: 1e5326eb38a3476d1a69733a43a5adb3526eba45
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: d53a0c3f32cf552316f14e49df91322f0b185a33
          path: candidate
          persist-credentials: false
      - name: Validate pinned sources and CRLF anchors without mutation
        run: node diagnostic/scripts/diagnostics/acceptance-639.mjs --check baseline candidate
      - name: Run paired acceptance sequence once per source
        run: node diagnostic/scripts/diagnostics/acceptance-639.mjs baseline candidate
