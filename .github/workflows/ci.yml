name: CI

# First CI workflow for this repo. Runs the same three commands a local
# `bun ci && bun run build && bun run typecheck && bun run test` would — no
# separate lint/format job exists yet. `bun run build` MUST run before
# typecheck/test: @byok-sdk/protocol's package.json `exports` point at its built
# `dist/`, not `src/`, so @byok-sdk/server and @byok-sdk/client can't even resolve
# `@byok-sdk/protocol` (let alone typecheck or test against it) until it's been
# built at least once in this checkout (empirically confirmed while wiring up
# this workflow — deleting every package's `dist/` breaks
# `bun run typecheck` with "Cannot find module '@byok-sdk/protocol'").
#
# The freeze-guard test (packages/protocol/src/__tests__/freeze-guard.test.ts)
# runs as an ordinary part of `bun run test` — no separate step for it.
#
# Node runtime: `.node-version` pins Node 24.22.1 for the baseline jobs.
# The Node 26 forward-compatibility leg is explicit; public engines.node is >=24.22.1.
#
# Note for anyone debugging a LOCAL sandbox run of this same test suite (not
# a concern for these hosted runners): a couple of integration tests
# (packages/server, packages/client) bind real HTTP/WS servers to
# `127.0.0.1`. Some heavily network-restricted local sandboxes disallow
# loopback socket binding and will flake those tests specifically; GitHub-
# hosted runners have a normal network stack and don't hit this.

# Routine PR/main changes run only the reviewed impact plan: the Linux
# affected-workspace job plus the platform families whose owned paths changed
# (scripts/ci/select-impact.mjs familyOwners). A PR never runs the complete
# matrix. The complete matrix requires an explicit release-validation dispatch
# on main or a release/* branch, pinned to this exact SHA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit approved for complete release validation (main or release/* only)
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  select:
    name: Select reviewed CI scope
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      families: ${{ steps.plan.outputs.families }}
      release: ${{ steps.plan.outputs.release }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Select impact or exact-SHA release validation
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_RELEASE_SHA: ${{ inputs.release_sha }}
          CI_REF: ${{ github.ref }}
        run: node scripts/ci/plan-ci.mjs

  targeted:
    name: Affected workspace checks
    needs: select
    if: needs.select.outputs.release != 'true'
    runs-on: ubuntu-latest
    env:
      BYOK_REQUIRE_BUN: '1'
      CI_PLAN: ${{ needs.select.outputs.plan }}
      CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      CI_EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Workflow and selector contracts
        run: node --test scripts/ci/*.test.mjs
      - name: Version authority
        run: node scripts/api-surface/check-version-authority.mjs
      - name: Install dependencies
        if: needs.select.outputs.build == 'true'
        run: bun ci
      - name: Build dependency artifacts
        if: needs.select.outputs.build == 'true'
        run: bun run build
      - name: Check API and version contracts
        if: needs.select.outputs.build == 'true'
        run: bun run check:api-surface && bun run check:version-authority && bun run check:release-graph
      - name: Install isolated credential-provider test dependencies
        if: needs.select.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools
          test "$(bun --version)" = "$(node -p "require('./package.json').packageManager.slice(4)")"
          bun --revision
          sha256sum "$(command -v bun)"
          echo "BYOK_TEST_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
      - name: Snapshot scoped test scratch directories
        if: needs.select.outputs.build == 'true'
        id: tmpdir-snapshot
        run: node scripts/ci/check-tmpdir-leaks.mjs snapshot "$RUNNER_TEMP/tmpdir-before.txt"
      - name: Run selected workspace and registry contracts
        run: |
          if [ '${{ needs.select.outputs.build }}' = 'true' ]; then
            bash scripts/ci/with-secret-service.sh node scripts/ci/run-targeted.mjs
          else
            node scripts/ci/run-targeted.mjs
          fi
      - name: Check scoped tests cleaned their scratch directories
        if: ${{ always() && steps.tmpdir-snapshot.outcome == 'success' }}
        run: node scripts/ci/check-tmpdir-leaks.mjs verify "$RUNNER_TEMP/tmpdir-before.txt"

  build-test:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'build-test') }}
    name: build, typecheck, test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [baseline, '26']
    env:
      # The formal gate half of the bun test gate
      # (packages/client/src/__tests__/support/test-bun-bin.ts): with it set,
      # the three bun-dependent suites hard-fail when no bun candidate exists
      # instead of silently skipping — a skip is not a success conclusion
      # here. Local developers leave it unset and keep the skip convenience.
      BYOK_REQUIRE_BUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        if: matrix.node == 'baseline'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup forward-compatible Node 26
        if: matrix.node == '26'
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Every setup-bun step reads the exact version from root packageManager (Bun 1.4.2).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The bun-dependent suites (pi-mcp-launch-cwd, pi-runtime-launch-cwd)
      # skip themselves when no bun candidate exists. Their fallback search
      # list includes ~/.bun/bin/bun for local runs, but this gate must not
      # depend on setup-bun's install layout. Without this step a layout
      # change would make them silently skip, and CI green would never cover
      # them.
      # The real absolute path is resolved rather than hardcoded so a
      # setup-bun install-layout change fails loudly here instead of
      # reintroducing silent skips; path, version and hash are printed as the
      # recorded Bun evidence for this run, and the path is handed to the
      # suites through BYOK_TEST_BUN_BIN.
      - name: Resolve Bun for the forced bun suites
        run: |
          BUN_PATH="$(command -v bun)"
          if [ -z "$BUN_PATH" ]; then
            echo "bun is not on PATH after setup-bun; the forced bun suites would silently skip" >&2
            exit 1
          fi
          echo "bun path: $BUN_PATH"
          BUN_EXPECTED_VERSION="$(node -p "require('./package.json').packageManager.slice(4)")"
          test "$(bun --version)" = "$BUN_EXPECTED_VERSION"
          bun --version
          bun --revision
          shasum -a 256 "$BUN_PATH"
          echo "BYOK_TEST_BUN_BIN=$BUN_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun ci

      - name: Build (required before typecheck/test — see note above)
        run: bun run build

      - name: Check API surface goldens
        run: bun run check:api-surface

      - name: Check version authority
        run: bun run check:version-authority

      - name: Test root scripts
        run: bun run test:scripts && node --test scripts/ci/*.test.mjs

      - name: Typecheck
        run: bun run typecheck

      # Test suites create scratch dirs under a per-run root (vitest globalSetup,
      # scripts/vitest/tmp-root.mjs). Anything new matching byok-* in the real
      # TMPDIR is a leak; snapshot first so only this run's entries count.
      - name: Snapshot TMPDIR before tests
        id: tmpdir-snapshot
        run: node scripts/ci/check-tmpdir-leaks.mjs snapshot "$RUNNER_TEMP/tmpdir-before.txt"

      # The dist CLI e2e uses the real device credential provider (#487).
      - name: Install isolated credential-provider dependencies on Linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools

      - name: Test
        run: bash scripts/ci/with-secret-service.sh bun run test

      - name: Check tests left no byok-* entries in TMPDIR
        if: ${{ always() && steps.tmpdir-snapshot.outcome == 'success' }}
        run: node scripts/ci/check-tmpdir-leaks.mjs verify "$RUNNER_TEMP/tmpdir-before.txt"

  agent-memory-export-linux:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'agent-memory-export-linux') }}
    name: task-free memory export (Linux native descriptors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run build
      - name: Qualify native export without platform skips
        env:
          BYOK_REQUIRE_MEMORY_EXPORT_TESTS: '1'
        run: bun run --filter @byok-sdk/client test -- src/__tests__/agent-memory-export.test.ts
      - name: Qualify synthetic restore through embedded notifications
        env:
          BYOK_REQUIRE_MEMORY_RESTORE_LINUX: '1'
        run: bun run --filter @byok-sdk/example-host-execution-core test -- src/memory-restore.test.ts src/memory-linux.test.ts

  agent-memory-helper-non-darwin:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'agent-memory-helper-non-darwin') }}
    name: agent memory helper non-Darwin volume checks (${{ matrix.os }}, fixed Go)
    runs-on: ${{ matrix.os }}
    # Each Windows leg runs the Go tests on NTFS twice: as the runner's
    # administrator, and as a new standard user. Node and Bun also check the
    # root identity that the TS caller sends to open. windows-latest is
    # Server 2025 and windows-2022 is Server 2022, so the evidence covers two
    # Windows builds. The TS gate admits Windows x64 recall and save, and B
    # stays false. See docs/plans/2026-10-22-605-windows-memory.md.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Setup fixed Node
        if: runner.os == 'Windows'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        if: runner.os == 'Windows'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: runner.os == 'Windows'
        run: bun ci

      - name: Test Go helper and non-Darwin volume identity
        working-directory: packages/client/native/agent-memory-fs
        run: go test -v ./... 2>&1 | tee "$RUNNER_TEMP/go-admin.txt"
        # An explicit bash shell sets pipefail, so a test failure fails the step.
        shell: bash
        env:
          GOTOOLCHAIN: go1.26.5
          # The Windows remote-volume refusal must run against the SMB loopback share.
          BYOK_REQUIRE_SMB_LOOPBACK_TEST: '1'

      - name: Check the administrator run passed the Windows tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # A skip or a renamed test also exits 0.
          for name in TestVersionAndOpenProtocol TestWindowsOpenWithJunctionFixtures TestWindowsReparseParentSwapCannotTouchOutsideSentinel TestWindowsMemoryResultBarrierFailsClosedOnNTFS TestWindowsProcessKillAtEachBarrierPointOnNTFS TestWindowsProcessKillAtRandomTimesOnNTFS TestWindowsOpenRefusesRemoteVolume TestWindowsRemoteVolumeQueryOnSMBLoopback; do
            grep -qF -- "--- PASS: $name (" "$RUNNER_TEMP/go-admin.txt" || { echo "administrator run did not pass $name" >&2; exit 1; }
          done

      - name: Check Node and Bun root identity against the helper handle
        if: runner.os == 'Windows'
        working-directory: packages/client/native/agent-memory-fs
        shell: pwsh
        env:
          GOTOOLCHAIN: go1.26.5
        run: |
          foreach ($runtime in 'node', 'bun') {
            $env:BYOK_TEST_AGENT_MEMORY_JS_RUNTIME = (Get-Command $runtime).Source
            $output = go test -v -count=1 -run '^TestWindowsRuntimeIdentityMatchesNativeHandle$' . 2>&1 | Out-String
            Write-Output $output
            if ($LASTEXITCODE -ne 0) { throw "$runtime identity check failed" }
            # A skip or a renamed test also exits 0.
            if ($output -notmatch '--- PASS: TestWindowsRuntimeIdentityMatchesNativeHandle \(') { throw "$runtime identity check did not pass" }
          }

      - name: Test Go helper as a standard user
        if: runner.os == 'Windows'
        working-directory: packages/client/native/agent-memory-fs
        shell: pwsh
        env:
          GOTOOLCHAIN: go1.26.5
        run: |
          go test -c -o "$env:RUNNER_TEMP/agent-memory-fs-tests.exe" .
          if ($LASTEXITCODE -ne 0) { throw 'test binary build failed' }
          # The runner token is an administrator. A new local account in Users
          # runs the same test binary. A standard user can create symlinks only
          # when Developer Mode is on, so the symlink subtests run only in the
          # administrator step. Their names end in -symlink, and -test.skip
          # leaves them out here. Junctions need no privilege and stay in this run.
          $user = 'byokntfs'
          # net user prompts for confirmation above 14 characters.
          $password = 'Aa1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          net user $user $password /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'standard user creation failed' }
          $work = Join-Path $env:RUNNER_TEMP 'standard-user'
          New-Item -ItemType Directory -Force (Join-Path $work 'tmp') | Out-Null
          Copy-Item "$env:RUNNER_TEMP/agent-memory-fs-tests.exe" $work
          icacls $work /grant "${user}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'work directory grant failed' }
          @(
            '@echo off'
            "set TMP=$work\tmp"
            "set TEMP=$work\tmp"
            'set BYOK_REQUIRE_SMB_LOOPBACK_TEST=1'
            "whoami /all > `"$work\token.txt`""
            "`"$work\agent-memory-fs-tests.exe`" -test.v -test.count=1 -test.skip `"/-symlink`$`" > `"$work\go.txt`" 2>&1"
            'exit /b %ERRORLEVEL%'
          ) | Set-Content -Encoding ascii (Join-Path $work 'run.cmd')
          $credential = [pscredential]::new($user, (ConvertTo-SecureString $password -AsPlainText -Force))
          # -LoadUserProfile gives the account a real profile, so the W2 home
          # chain probe also walks a user-owned LOCALAPPDATA chain.
          $process = Start-Process -FilePath (Join-Path $work 'run.cmd') -Credential $credential -WorkingDirectory $work -LoadUserProfile -Wait -PassThru
          Get-Content (Join-Path $work 'token.txt')
          Get-Content (Join-Path $work 'go.txt')
          $token = Get-Content -Raw (Join-Path $work 'token.txt')
          if ($token -notmatch "\\$user\b") { throw 'tests did not run as the standard user' }
          if ($token -match 'S-1-5-32-544') { throw 'standard user token holds Administrators' }
          if ($process.ExitCode -ne 0) { throw "standard-user tests failed: exit $($process.ExitCode)" }
          $output = Get-Content -Raw (Join-Path $work 'go.txt')
          if ($output -match '--- FAIL') { throw 'standard-user tests reported a failure' }
          # A renamed test would match nothing and still exit 0.
          foreach ($name in 'TestVersionAndOpenProtocol', 'TestWindowsOpenWithJunctionFixtures', 'TestWindowsReparseParentSwapCannotTouchOutsideSentinel', 'TestWindowsMemoryResultBarrierFailsClosedOnNTFS', 'TestWindowsProcessKillAtEachBarrierPointOnNTFS', 'TestWindowsProcessKillAtRandomTimesOnNTFS', 'TestWindowsOpenRefusesRemoteVolume', 'TestWindowsRemoteVolumeQueryOnSMBLoopback') {
            if ($output -notmatch "--- PASS: $name \(") { throw "standard-user run did not pass $name" }
          }

  # The Go helper is admitted on macOS and on Windows x64. Keep its toolchain
  # and the TypeScript-to-Go integration test in one independent job so the
  # admission path cannot be hidden behind the Linux full-suite skips.
  agent-memory-helper:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'agent-memory-helper') }}
    name: agent memory filesystem helper (${{ matrix.os }}, fixed Node/Bun/Go)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goarch: arm64
          - os: macos-15-intel
            goarch: amd64
          # Windows x64 admits recall and save without B (#605 W3b).
          - os: windows-latest
            goarch: amd64
    env:
      BYOK_EXPECT_GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The test Bun lookup knows only POSIX install paths, so the Windows leg
      # names the real bun.exe. BYOK_REQUIRE_BUN=1 makes a missing Bun fail
      # the compiled-product test instead of skipping it.
      - name: Resolve Bun for the compiled-product test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bun = (Get-Command bun -CommandType Application | Select-Object -First 1).Source
          if (-not (Test-Path -LiteralPath $bun -PathType Leaf)) { throw "bun is not a file: $bun" }
          "bun path: $bun"
          & $bun --version
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value "BYOK_TEST_BUN_BIN=$bun"
          Add-Content -Encoding utf8 -Path $env:GITHUB_ENV -Value 'BYOK_REQUIRE_BUN=1'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Install dependencies
        run: bun ci

      - name: Build needed packages
        run: bun run build

      - name: Build and verify SDK helper release assets
        run: bun run --filter @byok-sdk/client build:agent-memory-helper

      # The non-Darwin volume job runs the Windows Go tests.
      - name: Test Go helper
        if: runner.os == 'macOS'
        working-directory: packages/client/native/agent-memory-fs
        env:
          BYOK_REQUIRE_DARWIN_NONLOCAL_VOLUME: '1'
        run: GOTOOLCHAIN=go1.26.5 go test -race -v ./...

      - name: Build Go helper
        if: runner.os == 'macOS'
        working-directory: packages/client/native/agent-memory-fs
        run: CGO_ENABLED=0 GOTOOLCHAIN=go1.26.5 go build -buildvcs=false -trimpath -o "$RUNNER_TEMP/byok-agent-memory-fs" .

      - name: Check reproducible release bytes
        run: node packages/client/scripts/check-agent-memory-helper-build.mjs

      - name: Check native architecture and filesystem
        if: runner.os == 'macOS'
        run: |
          test "$(go env GOARCH)" = "$BYOK_EXPECT_GOARCH"
          cmp "$RUNNER_TEMP/byok-agent-memory-fs" "packages/client/dist/native/agent-memory-fs/darwin-$(node -p 'process.arch')"
          diskutil info "$(df -P "$RUNNER_TEMP" | awk 'NR==2 {print $1}')" | grep 'File System Personality'

      - name: Check native architecture and NTFS temp volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((go env GOARCH) -ne $env:BYOK_EXPECT_GOARCH) { throw "GOARCH is not $env:BYOK_EXPECT_GOARCH" }
          $volume = Get-Volume -DriveLetter ([IO.Path]::GetTempPath()[0])
          if ($volume.FileSystemType -ne 'NTFS') { throw "temp volume is $($volume.FileSystemType)" }
          "temp volume $($volume.DriveLetter): $($volume.FileSystemType)"

      - name: Run SDK helper, intent and capability contracts
        timeout-minutes: 10
        run: |
          bun run --filter @byok-sdk/client test -- src/__tests__/agent-memory-fs-helper.test.ts src/__tests__/agent-memory-helper-release.test.ts src/__tests__/agent-memory-helper-assets.test.ts src/__tests__/agent-memory-helper-asset-root-daemon.test.ts src/__tests__/agent-memory-helper-release-errors.test.ts src/__tests__/agent-memory-helper-admission.test.ts src/__tests__/agent-memory-mcp-admission.test.ts src/__tests__/agent-memory-helper-crash.test.ts src/__tests__/agent-memory-intent.test.ts src/__tests__/daemon-conn-hello-capabilities.test.ts src/__tests__/agent-home-directory-barrier.test.ts src/__tests__/agent-memory-helper-identity.test.ts src/__tests__/agent-memory-windows-gate.test.ts

      # The W5 power-cut harness (#605) kills and restarts device processes.
      # Its own time limit ends a hang with the log so far; the sampler and
      # the next step show the processes it left and what they used.
      - name: Run the W5 process-crash power-cut harness
        timeout-minutes: 5
        run: |
          if [ "$RUNNER_OS" != Windows ]; then
            (trap 'kill "$nap" 2>/dev/null; exit' TERM
              while :; do
                date -u +%T
                ps -axo pid,pgid,ppid,stat,%cpu,rss,etime,command | grep -E 'vitest|/bun |bun run|agent-memory|byok-|createServer' | grep -v grep | cut -c1-400 || true
                sleep 15 & nap=$!; wait "$nap"
              done) > "$RUNNER_TEMP/w5-processes.log" 2>&1 &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || true' EXIT
          fi
          bun run --filter @byok-sdk/client test -- --reporter=verbose --reporter=hanging-process src/__tests__/agent-memory-powercut.test.ts

      - name: Show processes during and after the W5 harness
        if: always() && runner.os != 'Windows'
        run: |
          cat "$RUNNER_TEMP/w5-processes.log" || true
          ps -axo pid,pgid,ppid,stat,%cpu,rss,etime,command

      - name: Qualify task-free export against the release helper
        env:
          BYOK_REQUIRE_MEMORY_EXPORT_TESTS: '1'
        run: bun run --filter @byok-sdk/client test -- src/__tests__/agent-memory-export.test.ts

      - name: Prove real Node and Bun helper identity
        run: |
          node packages/client/scripts/agent-memory-runtime-smoke.mjs
          bun packages/client/scripts/agent-memory-runtime-smoke.mjs

      # Node and Bun spawn the release helper with an empty environment. A
      # junction home is refused, and a junction inside the home refuses the
      # write. Moved from agent-memory-windows.yml (#605 W7).
      - name: Check the helper open with junction fixtures under Node and Bun
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $helper = (Resolve-Path packages/client/dist/native/agent-memory-fs/win32-x64.exe).Path
          node packages/client/scripts/agent-memory-windows-junction-smoke.mjs $helper
          if ($LASTEXITCODE -ne 0) { throw 'Node junction smoke failed' }
          bun packages/client/scripts/agent-memory-windows-junction-smoke.mjs $helper
          if ($LASTEXITCODE -ne 0) { throw 'Bun junction smoke failed' }

      # Node runs the same flow in agent-memory-intent.test.ts (W4).
      - name: Run the intent processor over the real helper under Bun
        run: bun packages/client/scripts/agent-memory-intent-helper-smoke.mjs

      # npm-release-pack verifies the Windows pack.
      - name: Verify the installed release artifacts and re-signing policy
        if: runner.os == 'macOS'
        run: bun run check:release-pack -- --out-dir .ci-artifacts/mac-helper-pack

  execution-recovery-native:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'execution-recovery-native') }}
    name: compiled execution recovery (${{ matrix.platform }}, Node 24, Bun 1.4.2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies and build
        run: bun ci && bun run build
      - name: Install native credential and process tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools perl procps
      - name: Exercise actual native SIGKILL and original terminal recovery
        env:
          BYOK_REQUIRE_SQLITE: '1'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) test "$(uname -s)" = Darwin ;;
            Linux) test "$(uname -s)" = Linux ;;
            *) exit 1 ;;
          esac
          evidence_dir="$GITHUB_WORKSPACE/artifacts/execution-recovery"
          mkdir -p "$evidence_dir"
          git rev-parse HEAD > "$evidence_dir/recovery-source.txt"
          uname -srm >> "$evidence_dir/recovery-source.txt"
          node --version >> "$evidence_dir/recovery-source.txt"
          bun --version >> "$evidence_dir/recovery-source.txt"
          recovery_command=(bun run --cwd packages/client test -- src/__tests__/execution-recovery-kill.test.ts src/__tests__/journal-sqlite.test.ts)
          if [[ "$RUNNER_OS" == Linux ]]; then
            credential_root="$(mktemp -d /tmp/byok-recovery-credentials.XXXXXX)"
            trap 'rm -rf -- "$credential_root"' EXIT
            mkdir -m 700 "$credential_root/data" "$credential_root/runtime"
            export XDG_DATA_HOME="$credential_root/data"
            export XDG_RUNTIME_DIR="$credential_root/runtime"
            recovery_command=(bash scripts/ci/with-secret-service.sh "${recovery_command[@]}")
          fi
          "${recovery_command[@]}" 2>&1 | tee "$evidence_dir/execution-recovery.log"
      - name: Retain exact source and native recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-recovery-native-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/execution-recovery/recovery-source.txt
            artifacts/execution-recovery/execution-recovery.log
          if-no-files-found: error

  adapter-lifecycle-smoke:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'adapter-lifecycle-smoke') }}
    name: built adapter lifecycle smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build packages
        run: bun run build

      - name: Run built adapter lifecycle smoke
        run: bun run --filter @byok-sdk/client smoke:adapters

      # The Host suites run the embedded server, daemon journal and Host ledger
      # in one process. Each commits to synchronous node:sqlite with fsync, so
      # every commit blocks the event loop for the length of one fsync. The
      # default temp root is on the runner OS disk (fsync p50 4 ms, p99 up to
      # 210 ms). runner.temp is on the local NVMe disk (fsync p50 0.1 ms).
      # Keep the temp root there. Do not weaken the durability settings.
      # See docs/notes/2026-10-22-windows-k8-fsync-stalls.md.
      # Full K4 discovery preserves the existing Linux-only device-memory skips.
      - name: K4 Windows Host execution qualification
        if: matrix.os == 'windows-latest'
        run: bun run --cwd examples/host-execution-core test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      # #738: every K8 suite runs, with the real persona fixture suites. The
      # persona consumer writes AGENTS.md with the SDK writeHomeFile.
      - name: K8 Windows portable Bot qualification
        if: matrix.os == 'windows-latest'
        run: node scripts/ci/run-windows-bot-tests.mjs
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      # SDK Windows v1 gate for sealed provider provisioning (plan A11): the
      # device sealing key, configure/replace/delete custody, and the
      # launcher's custody snapshot against the REAL Windows Credential
      # Manager, as the runner's own user (the daemon and the launcher share
      # one user). The flag makes the suite hard-fail rather than skip.
      - name: Sealed provisioning on the real Windows Credential Manager
        if: matrix.os == 'windows-latest'
        env:
          BYOK_TEST_WINDOWS_CREDENTIAL_MANAGER: '1'
        run: bun run --filter @byok-sdk/keys test -- src/windows-credential-custody.integration.test.ts

      # #609: Windows detection still refuses Grok (platform_unsupported).
      # This runs the Grok fixture contract (the fake ACP agent behind a
      # compiled launcher) through the shared Windows process-tree path. It
      # is not a live Grok run; docs/adapter-capabilities.md lists what still
      # needs one.
      - name: Grok fixture contract on Windows
        if: matrix.os == 'windows-latest'
        run: bun run --filter @byok-sdk/client test -- src/adapters/grok/__tests__/grok-windows-contract.test.ts

  # S4A dataplane guarantee: runs the suites that need a REAL Postgres, against
  # the same `docker-compose.test.yml` a developer starts locally. This job is
  # the only authority for the dataplane assertions -- `build-test` above also
  # runs these packages' tests, but without BYOK_TEST_POSTGRES_URL they skip
  # themselves, which is correct there and would be a silent hole here.
  #
  # BYOK_REQUIRE_DATAPLANE=1 is what closes that hole: with it set, a missing
  # BYOK_TEST_POSTGRES_URL is a hard failure instead of a skip
  # (packages/cloud-dataplane/src/__tests__/support/dataplane.ts throws at import
  # time). `process.env.CI` deliberately is NOT the gate -- `bun run test` in
  # build-test already runs with CI=true where these services do not exist, so
  # keying off it would turn that job red.
  #
  # This job's existence is itself pinned by a source-scan constraint test
  # (packages/cloud-dataplane/src/__tests__/constraints.test.ts), the same idiom
  # the core/cloud packages already use: deleting or renaming the job below
  # turns that test red rather than silently dropping dataplane coverage.
  #
  # A compose file rather than GitHub `services:` containers because a service
  # container cannot override CMD, and the S3 substrate (needed from S4A-c)
  # runs with explicit `mini` flags. One file therefore defines the substrate
  # for CI and for a laptop, which is the point.
  #
  # Deliberately independent of build-test (no `needs:`): its own install +
  # build, so a docker flake here cannot mask unit coverage there.
  dataplane:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'dataplane') }}
    name: dataplane suites against real Postgres (fixed Node)
    runs-on: ubuntu-latest
    env:
      BYOK_REQUIRE_DATAPLANE: '1'
      BYOK_TEST_POSTGRES_URL: postgres://byok:byok@127.0.0.1:5433/byok_test
      # Both halves of the substrate, one gate: from S4A-c the blob port is
      # part of the conformance scope, and its Postgres composition writes a
      # manifest row and signs against SeaweedFS in the same call. A missing
      # endpoint is a hard failure here for exactly the same reason a missing
      # database URL is.
      BYOK_TEST_S3_ENDPOINT: http://127.0.0.1:9100
      # The live workerd runtime E2E (worker-smoke fixture over wrangler dev)
      # follows the same law with its own env pair: opt-in below, and the
      # REQUIRE flag turns an unmet gate into a hard failure instead of a
      # skip. Locally it is opt-in because it spawns wrangler dev; here the
      # substrate is already up, so there is no reason not to prove the
      # Worker composition against the same Postgres the suites above used.
      BYOK_REQUIRE_WORKER_DATAPLANE: '1'
      BYOK_TEST_WORKER_DATAPLANE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup release helper Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Install dependencies
        run: bun ci

      # `--wait` blocks until every service reports healthy, so the suites below
      # never race startup. The database starts EMPTY on every run, which makes
      # "fresh install + migrate-up" (sprint S4A.5) a property of the job rather
      # than a step someone remembers.
      - name: Start the dataplane substrate
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Build (required before typecheck/test — see note above)
        run: bun run build

      # The migrate runner's fault suite plus the Postgres composition running
      # the cloud conformance suite.
      - name: Dataplane suites (Postgres composition + migrate runner)
        run: bun run --filter @byok-sdk/cloud-dataplane test

      # The same assertion source against the in-memory composition. Running
      # both in one job is what makes a divergence a failure here rather than a
      # discrepancy someone notices later.
      - name: Conformance suites (in-memory compositions)
        run: bun run --filter @byok-sdk/conformance test

      # #793 D2: the hosted (H) Bot collaboration example suites. This is the
      # only job with a real Postgres, so the example's Postgres suites run
      # here. The selector maps the example to this family, and
      # examples/hosted-bot-collaboration/src/ci.test.ts pins this step.
      - name: Hosted Bot collaboration example suites
        run: bun run --filter @byok-sdk/example-hosted-bot-collaboration test

      # #794 D3: the H Host composed as a Worker, served by wrangler dev (local
      # workerd) over this job's Postgres and S3 endpoint, with its fault suites
      # and two device processes. The job-level BYOK_REQUIRE_WORKER_DATAPLANE
      # flag turns an unmet gate into a failure.
      # examples/hosted-bot-collaboration-worker/src/ci.test.ts pins this step.
      - name: Hosted Bot collaboration Worker suites
        run: bun run --filter @byok-sdk/example-hosted-bot-collaboration-worker test

      # Issue #196 durable restart leg: the recurring packed smoke's restart
      # scenario runs against THIS job's compose Postgres from the EXACT
      # tarballs the release driver packs -- never repacked, never from a
      # source checkout. The job-level env pair above is the substrate selector
      # the smoke already speaks, and BYOK_REQUIRE_DATAPLANE=1 is what makes a
      # missing/failing substrate a hard failure here instead of a quiet
      # in-memory pass (the same law as the suites above). The smoke's
      # in-memory legs are the npm-release-pack gate's coverage on all three
      # OSes; the durable leg is structurally present only where the substrate
      # exists, never skipped-while-counting-as-covered. The run's
      # release-manifest.json (printed to the log) carries the source SHA and
      # per-tarball hashes the smoke evidence refers to.
      - name: Install isolated credential-provider dependencies on Linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools

      - name: Recurring smoke durable restart leg from packed tarballs
        run: bash scripts/ci/with-secret-service.sh bun run check:release-pack -- --out-dir .ci-artifacts/release-pack

      # repo-harness stays outside the dependency graph and is fetched at the
      # pinned tool version only for this check.
      - name: Migration ordering check
        run: bunx repo-harness@0.13.2 run check-deploy-sql-order

      - name: Tear down the dataplane substrate
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Windows filesystem and security guarantee: exercises the secure directory
  # and privacy surfaces without duplicating the full cross-platform suite
  # above. TEMP/TMP are redirected to a path containing spaces and non-ASCII
  # characters so the real file operations cross that boundary on Windows.
  # The Git workspace suites it was named for were removed in wire v4 (#925).
  windows-git-workspace:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'windows-git-workspace') }}
    name: Windows Git workspace, store, and security tests (fixed Node)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build client dependencies
        run: bun run build

      - name: Run security tests in special-character paths
        run: |
          $specialTemp = Join-Path $env:RUNNER_TEMP "byok git workspace 空間"
          New-Item -ItemType Directory -Force -Path $specialTemp | Out-Null
          $env:TEMP = $specialTemp
          $env:TMP = $specialTemp
          bun run --filter @byok-sdk/client test -- `
            src/__tests__/secure-dir.test.ts

      - name: Run diagnostics and lifecycle lease safety tests on Windows
        run: |
          bun run --filter @byok-sdk/client test -- `
            src/__tests__/diagnostics.test.ts `
            src/__tests__/support-bundle.test.ts `
            src/__tests__/daemon-auth.test.ts `
            src/__tests__/daemon-stop-shutdown-parity.test.ts

      # #738: writeHomeFile on NTFS. A child process is killed at five points
      # of a three-file projection apply; each file must keep its old or new bytes.
      - name: Run Agent-home file write crash tests on Windows
        run: bun run --filter @byok-sdk/client test -- src/__tests__/agent-home-write-file.test.ts

      # #712: the Hermes gateway control pipe, ownership walk and custody launcher on Windows.
      # Two steps: the pwsh step fails only on the exit code of its last command.
      - name: Run Hermes adapter, custody and gateway control tests on Windows
        run: |
          bun run --filter @byok-sdk/client test -- `
            src/__tests__/hermes-adapter.test.ts `
            src/__tests__/hermes-custody.test.ts `
            src/__tests__/hermes-gateway-control.test.ts `
            src/__tests__/hermes-home.test.ts

      - name: Run the Hermes custody launcher tests on Windows
        run: bun run --filter @byok-sdk/keys test -- src/__tests__/hermes-provider-launcher.test.ts

  # M3-K packageability guarantee smoke: proves the daemon CAN be compiled
  # into a single-file executable (bun build --compile / Node SEA) while
  # runtime CLIs remain external subprocesses. A single-file bundle without
  # its required Pi sidecar must report `present: false`, while BYOK_PI_BIN
  # must remain detectable. See
  # templates/packaging/{bun,sea} for
  # the full recipes + empirically-confirmed rationale (including a macOS
  # postject gotcha that silently segfaults without one extra flag), and
  # examples/packaging/launcher.ts for the entry point both recipes compile.
  #
  # Decision-6 boundary: this is a packageability GUARANTEE (a smoke proving
  # the daemon can be single-file-bundled) plus reference recipes a product
  # copies -- not the SDK producing, signing, or distributing a binary
  # itself. Nothing in this job signs, notarizes, or distributes anything.
  #
  # Deliberately independent of build-test above (no `needs:`): each leg
  # does its own install + build, so this job can be extended or reordered
  # later (e.g. a Windows-Service CI job) without perturbing build-test's
  # own matrix or steps.
  #
  # windows-latest is included for both recipes -- bun natively
  # cross-platform compiles, and Node SEA on Windows needs no macOS-style
  # codesign dance (see templates/packaging/sea/build.sh) -- both were wired
  # up per Node's own documented per-OS steps, but only macOS + Linux were
  # actually run on the machine these recipes were authored on (no local
  # Windows box available). If a windows-latest leg goes red, that is
  # exactly this job's purpose: catch it here, not in a product downstream.
  packageability-smoke:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'packageability-smoke') }}
    name: packageability smoke (${{ matrix.recipe }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        recipe: [bun, sea]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build (needed so @byok-sdk/client has a dist/ to bundle)
        run: bun run build

      # copySdkNativeAssets for win32 also copies the Agent memory helper, so
      # the legs that copy Windows assets build the helper release first.
      - name: Setup Go for the Agent memory helper
        if: matrix.recipe == 'sea' && matrix.os != 'ubuntu-latest'
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Build the Agent memory helper release assets
        if: matrix.recipe == 'sea' && matrix.os != 'ubuntu-latest'
        run: bun run --filter @byok-sdk/client build:agent-memory-helper

      - name: Cross-build pinned Windows native assets on macOS
        if: matrix.recipe == 'sea' && matrix.os == 'macos-latest'
        run: node examples/packaging/native-assets-smoke.mjs --copy-only

      - name: Relocated Windows SEA native process ownership
        if: matrix.recipe == 'sea' && matrix.os == 'windows-latest'
        run: node examples/packaging/native-assets-smoke.mjs

      - name: Verify loopback ownership and native MCP transport
        if: matrix.recipe == 'bun'
        run: |
          bun run --filter @byok-sdk/server test -- src/__tests__/loopback.test.ts
          bun run --filter @byok-sdk/example-byok-mcp-server test -- src/loopback.test.ts

      - name: SQLite ESM, CJS and relocated SEA smoke
        if: matrix.recipe == 'sea'
        run: node examples/packaging/sqlite-smoke.mjs --sea

      - name: Run packaging smoke
        run: templates/packaging/${{ matrix.recipe }}/smoke-test.sh

  # S7-c public npm guarantee: pack every published package (the aligned
  # train plus keys, all on one version; no umbrella since 0.21.0),
  # install the exact tarballs into a clean npm project, import every direct
  # package entry, and prove the installed graph closes to exactly that set.
  # This is distinct from the SEA/bun binary recipes above:
  # those prove the host can bundle the daemon; this proves registry consumers
  # can install the library graph itself.
  npm-release-pack:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'npm-release-pack') }}
    name: npm release pack/install (${{ matrix.os }}, fixed Node)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup release helper Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Install dependencies
        run: bun ci

      - name: Install isolated credential-provider dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools

      - name: Check graph, pack exact tarballs, and import from an isolated npm install
        if: runner.os == 'macOS'
        run: bun run check:release-pack -- --out-dir .ci-artifacts/release-pack

      - name: Check packed CLI with an ephemeral Secret Service on Linux
        if: runner.os == 'Linux'
        run: bash scripts/ci/with-secret-service.sh bun run check:release-pack -- --out-dir .ci-artifacts/release-pack

      # The hosted windows-latest runner is an ADMINISTRATOR. This leg runs the
      # SAME driver, with the same arguments, as the other two legs, but under a
      # freshly created NON-administrator local account. The Pi key projection
      # ACL tests and the packed install then run under a standard-user token.
      #
      # Everything this step creates (the account, one scratch root, one granted
      # ACE on the checkout, one out-of-tree canary root behind a junction) lives
      # on this ephemeral runner and is removed in `finally`; the teardown strips
      # reparse points link-only before ANY recursive pass (icacls /T or
      # recursive delete), and the canary file OUTSIDE the scratch root -- its
      # SHA-256 and its `icacls /save` ACL baseline -- is what proves that no
      # recursive pass followed a link out of the tree, in content or in ACLs.
      # Evidence in the job log: the ASSERTED token membership and integrity
      # label, `[release-pack] installed Pi...`/`[packed-cli-mcp] ... passed`,
      # the content-and-ACL-identical canary, and the ABSENCE of `task.decline`.
      - name: Check graph, pack, and install as a freshly created NON-administrator local user
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # This one script runs twice: once as the runner's administrator (parent),
          # and once as the synthetic standard user, which runs a byte-identical copy
          # of this same file. Same bytes, two tokens. The mode and the three child
          # paths travel in BYOK_LOWPRIV_* environment variables, NOT in a top-level
          # `param(...)`: the Actions runner prepends `$ErrorActionPreference = 'stop'`
          # to every pwsh `run:` script (ScriptHandlerHelpers.FixUpScriptContents), so
          # `param` would no longer be the first statement and the script would not
          # parse. A three-line launcher written next to the copy sets those variables
          # and dot-invokes the copy in-process.
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Fail([int]$code, [string]$message) {
            Write-Host "[lowpriv] FAIL($code) $message"
            exit $code
          }

          if ($env:BYOK_LOWPRIV_MODE -eq 'child') {
            # ---------------- standard-user half ----------------
            $ScratchRoot = $env:BYOK_LOWPRIV_SCRATCH
            $Workspace = $env:BYOK_LOWPRIV_WORKSPACE
            $NodeDir = $env:BYOK_LOWPRIV_NODEDIR
            foreach ($pair in @(@('BYOK_LOWPRIV_SCRATCH', $ScratchRoot), @('BYOK_LOWPRIV_WORKSPACE', $Workspace), @('BYOK_LOWPRIV_NODEDIR', $NodeDir))) {
              if ([string]::IsNullOrWhiteSpace($pair[1])) { Fail 86 "child mode is missing $($pair[0])" }
            }

            # 1. The token is evidence INPUT, not decoration: assert it, do not just print it.
            $me = (whoami).Trim()
            Write-Host "[lowpriv] whoami: $me"
            $names = @(whoami /groups /fo csv | ConvertFrom-Csv | ForEach-Object { $_.'Group Name' })
            foreach ($n in $names) { Write-Host "[lowpriv] group: $n" }
            if ($names -notcontains 'BUILTIN\Users') { Fail 80 'this token is NOT a member of BUILTIN\Users' }
            if ($names -contains 'BUILTIN\Administrators') { Fail 81 'this token IS a member of BUILTIN\Administrators' }
            $labels = @($names | Where-Object { $_ -like 'Mandatory Label\*' })
            if ($labels.Count -ne 1) { Fail 82 "expected exactly one mandatory integrity label, saw $($labels.Count)" }
            if ($labels[0] -match 'High Mandatory Level|System Mandatory Level') { Fail 83 "integrity label is $($labels[0])" }
            Write-Host "[lowpriv] integrity label: $($labels[0])"

            # 2. Every per-user path points under the scratch root -- nothing inherits
            #    the administrator runner's home -- and each one is asserted to be
            #    granted to THIS account before anything writes to it.
            $userHome = Join-Path $ScratchRoot 'home'
            $env:USERPROFILE = $userHome
            $env:HOME = $userHome
            $env:APPDATA = Join-Path $userHome 'AppData\Roaming'
            $env:LOCALAPPDATA = Join-Path $userHome 'AppData\Local'
            $env:TEMP = Join-Path $ScratchRoot 'tmp'
            $env:TMP = $env:TEMP
            $env:npm_config_cache = Join-Path $ScratchRoot 'npm-cache'
            $env:BUN_INSTALL_CACHE_DIR = Join-Path $ScratchRoot 'bun-cache'
            foreach ($d in @($userHome, $env:APPDATA, $env:LOCALAPPDATA, $env:TEMP, $env:npm_config_cache, $env:BUN_INSTALL_CACHE_DIR)) {
              if (-not $d.StartsWith($ScratchRoot, [System.StringComparison]::OrdinalIgnoreCase)) { Fail 84 "$d is not under $ScratchRoot" }
              New-Item -ItemType Directory -Force -Path $d | Out-Null
              $acl = (icacls $d) -join "`n"
              if ($acl -notmatch [regex]::Escape($me)) { Fail 85 "$d is not granted to ${me}:`n$acl" }
              $probe = Join-Path $d '.byok-lowpriv-write.tmp'
              [System.IO.File]::WriteAllText($probe, 'x')
              Remove-Item -LiteralPath $probe -Force
              Write-Host "[lowpriv] private dir OK: $d"
            }

            # Inherited from the administrator parent and pointing at a file only
            # that token can write: vitest appends its summary there and dies with
            # EPERM under this one. Unset in the child only -- the parent job keeps
            # its own summary file and writes to it untouched.
            Remove-Item Env:GITHUB_STEP_SUMMARY -ErrorAction SilentlyContinue

            # The inherited PSModulePath is deliberately KEPT. It starts with the
            # parent pwsh's PowerShell 7 module directories: the condition under
            # which the keys Pi projection ACL query used to fail
            # (CouldNotAutoloadMatchingModule for Get-Acl). The query invokes no
            # cmdlet now, and the keys suite and the custody lane below must pass
            # with it inherited, as a user's PowerShell 7 session would pass it.
            #
            # No Windows PowerShell prepay runs here. The first powershell.exe this
            # new local account starts pays a one-time first-use cost; the keys
            # suite's first (cold) case pays it itself, inside the client's 30s
            # startup deadline, and checks that it is the first ACL query. Any
            # powershell.exe spawn before that suite would hide the cost it proves.

            # git compares safe.directory against its own forward-slash spelling of
            # this exact checkout. Never '*'.
            $env:GIT_CONFIG_COUNT = '1'
            $env:GIT_CONFIG_KEY_0 = 'safe.directory'
            $env:GIT_CONFIG_VALUE_0 = $Workspace.Replace('\', '/')
            $env:PATH = "$ScratchRoot\tools;$NodeDir;$env:PATH"

            Set-Location -LiteralPath $Workspace
            Write-Host "[lowpriv] node: $((Get-Command node).Source)"
            Write-Host "[lowpriv] bun: $((Get-Command bun).Source)"

            # The clean checkout has no built workspace artifacts, and the keys
            # suite resolves `@byok-sdk/core` (custody, sealed provisioning)
            # through its dist-only package entry, so build it before that
            # suite loads it.
            # The other two legs get the equivalent build from pack-and-smoke.mjs,
            # which runs later in this child and rebuilds the full workspace for
            # packing.
            bun run --filter @byok-sdk/core build
            if ($LASTEXITCODE -ne 0) { Fail $LASTEXITCODE 'core build failed under the standard-user token' }

            # Real credential-projection directory validation under this same token.
            bun run --filter @byok-sdk/keys test -- src/pi-projection-windows.test.ts
            if ($LASTEXITCODE -ne 0) { Fail $LASTEXITCODE 'Pi projection ACL positive/negative tests failed under the standard-user token' }

            # 3. Same driver, same arguments as the non-Windows legs. A `task.decline`
            #    or a fail-closed refusal already exits non-zero inside the smoke; this
            #    step adds no acceptance of either.
            node scripts/release/pack-and-smoke.mjs --out-dir .ci-artifacts/release-pack
            if ($LASTEXITCODE -ne 0) { Fail $LASTEXITCODE 'pack-and-smoke.mjs failed under the standard-user token' }

            # #385 on Windows: the real keys launch sequence and the built pi-rpc
            # host, on the workspace pack-and-smoke.mjs just built. It runs under
            # this standard-user token because an elevated token's new directories
            # are owned by BUILTIN\Administrators, which the launcher refuses
            # (pi_projection_owner_mismatch).
            $env:BYOK_REQUIRE_BUN = '1'
            $env:BYOK_TEST_BUN_BIN = Join-Path $ScratchRoot 'tools\bun.exe'
            bun run --filter @byok-sdk/client test -- src/__tests__/pi-rpc-key-custody.test.ts
            if ($LASTEXITCODE -ne 0) { Fail $LASTEXITCODE 'pi-rpc key custody lane failed under the standard-user token' }

            Write-Host '[lowpriv] release pack completed under a non-administrator token'
            exit 0
          }

          if (-not [string]::IsNullOrWhiteSpace($env:BYOK_LOWPRIV_MODE)) {
            throw "unknown BYOK_LOWPRIV_MODE '$($env:BYOK_LOWPRIV_MODE)'"
          }

          # ---------------- administrator half ----------------
          $selfScript = $PSCommandPath
          if ([string]::IsNullOrWhiteSpace($selfScript) -or -not (Test-Path -LiteralPath $selfScript)) {
            throw 'cannot locate this step script to re-invoke it as the standard user'
          }

          # Unique per run AND per attempt, and short enough for the 20-character
          # local-account limit, so a re-run can never adopt a leftover account.
          $runId = "$env:GITHUB_RUN_ID"
          $runTag = '{0}a{1}' -f $runId.Substring([Math]::Max(0, $runId.Length - 8)), $env:GITHUB_RUN_ATTEMPT
          $account = "byoklp$runTag"
          if ($account.Length -gt 20) { throw "generated account name '$account' exceeds the 20-character local account limit" }
          $scratch = "C:\byok-lowpriv-$runTag"
          $canary = "C:\byok-lowpriv-canary-$runTag"
          $checkout = "$env:GITHUB_WORKSPACE"
          $nodeHome = Split-Path -Parent (Get-Command node).Source
          $bunSrc = (Get-Command bun).Source
          $pwshExe = (Get-Command pwsh).Source
          Write-Host "[lowpriv] account=$account scratch=$scratch canary=$canary checkout=$checkout"
          Write-Host "[lowpriv] node dir=$nodeHome bun=$bunSrc"

          # Link-only reparse point removal, several passes (a link nested
          # inside a link frees the inner one only when the outer link is
          # deleted). Returns the reparse points still present under $root once
          # the passes are exhausted -- an empty list means the tree is
          # link-free and safe for recursive passes. Enumeration never descends
          # into reparse points, so the scan itself cannot escape the tree.
          function Get-RemainingReparsePoints([string]$root) {
            for ($pass = 1; $pass -le 5; $pass++) {
              $reparse = @(Get-ChildItem -LiteralPath $root -Recurse -Force -Attributes ReparsePoint -ErrorAction SilentlyContinue)
              if ($reparse.Count -eq 0) { return @() }
              foreach ($rp in $reparse) {
                Write-Host "[lowpriv] teardown: removing reparse point link $($rp.FullName)"
                try {
                  if ($rp.PSIsContainer) { [System.IO.Directory]::Delete($rp.FullName, $false) }
                  else { [System.IO.File]::Delete($rp.FullName) }
                } catch {
                  if ($pass -eq 5) { Write-Host "[lowpriv] teardown: link removal failed for $($rp.FullName): $($_.Exception.Message)" }
                }
              }
            }
            return @(Get-ChildItem -LiteralPath $root -Recurse -Force -Attributes ReparsePoint -ErrorAction SilentlyContinue)
          }

          $created = $false
          $accountSid = $null
          $scratchCreated = $false
          $canaryCreated = $false
          $childCode = $null
          $cleanupFailures = @()
          try {
            # Password: generated in memory into a PSCredential. Never echoed, never on
            # a command line, never in GITHUB_ENV, never in a step output.
            $bytes = [byte[]]::new(32)
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
            $secret = ConvertTo-SecureString ([Convert]::ToBase64String($bytes) + '!Aa1') -AsPlainText -Force
            [System.Array]::Clear($bytes, 0, $bytes.Length)

            New-LocalUser -Name $account -Password $secret -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword -Description 'ephemeral byok CI standard user' | Out-Null
            $created = $true
            # Captured now, while the name still resolves: teardown revokes ACEs by SID
            # so that revocation does not depend on the account still existing.
            $accountSid = (Get-LocalUser -Name $account).SID.Value
            Write-Host "[lowpriv] account SID: $accountSid"
            Add-LocalGroupMember -Group 'Users' -Member $account
            $cred = [System.Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$account", $secret)

            # Only a scratch root THIS run creates is ever torn down. A pre-existing
            # path of the same name is refused, never adopted and never deleted.
            if (Test-Path -LiteralPath $scratch) { throw "scratch root $scratch already exists; refusing to adopt or delete a path this run did not create" }
            New-Item -ItemType Directory -Path $scratch | Out-Null
            $scratchCreated = $true
            # The only two grants this account ever gets: the scratch root and the checkout.
            icacls $scratch /grant "${account}:(OI)(CI)(M)" /Q
            if ($LASTEXITCODE -ne 0) { throw "icacls grant on $scratch failed ($LASTEXITCODE)" }
            icacls $checkout /grant "${account}:(OI)(CI)(M)" /T /C /Q
            if ($LASTEXITCODE -ne 0) { throw "icacls grant on $checkout failed ($LASTEXITCODE)" }

            # Out-of-tree canary: the junction below points OUTSIDE the scratch
            # root. If a recursive pass ever follows a link out of the tree, the
            # canary's bytes or its ACLs stop matching the pre-cleanup baseline
            # below and the teardown fails instead of silently crawling the
            # filesystem outside the scratch root. The baseline pins BOTH the
            # file content (SHA-256) and the ACLs (`icacls /save` of the canary
            # root + file); the snapshot lives in RUNNER_TEMP, never under the
            # scratch root or the canary itself, so an escaped traversal cannot
            # destroy its own evidence.
            if (Test-Path -LiteralPath $canary) { throw "canary root $canary already exists; refusing to adopt or delete a path this run did not create" }
            New-Item -ItemType Directory -Path $canary | Out-Null
            $canaryCreated = $true
            $canaryFile = Join-Path $canary 'canary.txt'
            Set-Content -LiteralPath $canaryFile -Value "byok-lowpriv canary $runTag" -NoNewline
            $canaryHashBefore = (Get-FileHash -LiteralPath $canaryFile -Algorithm SHA256).Hash
            New-Item -ItemType Junction -Path (Join-Path $scratch 'canary-link') -Target $canary | Out-Null
            $canaryAclBeforeFile = Join-Path $env:RUNNER_TEMP "byok-lowpriv-canary-$runTag-acl-before-file.acl"
            $canaryAclBeforeDir = Join-Path $env:RUNNER_TEMP "byok-lowpriv-canary-$runTag-acl-before-dir.acl"
            icacls $canaryFile /save $canaryAclBeforeFile /Q
            if ($LASTEXITCODE -ne 0) { throw "icacls /save of the canary file exited $LASTEXITCODE; refusing cleanup without a provable out-of-tree baseline" }
            icacls $canary /save $canaryAclBeforeDir /Q
            if ($LASTEXITCODE -ne 0) { throw "icacls /save of the canary root exited $LASTEXITCODE; refusing cleanup without a provable out-of-tree baseline" }
            Write-Host "[lowpriv] canary: $canary linked at $(Join-Path $scratch 'canary-link'); acl baselines $canaryAclBeforeDir + $canaryAclBeforeFile; sha256 $canaryHashBefore"

            New-Item -ItemType Directory -Force -Path "$scratch\tools", "$scratch\logs" | Out-Null
            # bun lives under the administrator's profile, which this account cannot execute.
            Copy-Item -LiteralPath $bunSrc -Destination "$scratch\tools\bun.exe"
            $childScript = Join-Path $scratch 'run-lowpriv.ps1'
            Copy-Item -LiteralPath $selfScript -Destination $childScript

            # The launcher carries no logic: it sets the four variables and invokes the
            # byte-identical copy in its own process, then propagates its exit code.
            $q = { param([string]$v) "'" + $v.Replace("'", "''") + "'" }
            $launcher = Join-Path $scratch 'launch-lowpriv.ps1'
            $launcherLines = [string[]] @(
              ('$env:BYOK_LOWPRIV_MODE = ' + (& $q 'child')),
              ('$env:BYOK_LOWPRIV_SCRATCH = ' + (& $q $scratch)),
              ('$env:BYOK_LOWPRIV_WORKSPACE = ' + (& $q $checkout)),
              ('$env:BYOK_LOWPRIV_NODEDIR = ' + (& $q $nodeHome)),
              ('& ' + (& $q $childScript)),
              'exit $LASTEXITCODE'
            )
            Set-Content -LiteralPath $launcher -Value $launcherLines -Encoding utf8
            Write-Host "[lowpriv] launcher written to $launcher"

            $stdoutLog = Join-Path $scratch 'logs\child-stdout.log'
            $stderrLog = Join-Path $scratch 'logs\child-stderr.log'
            $argLine = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"' -f $launcher
            $proc = Start-Process -FilePath $pwshExe -ArgumentList $argLine -Credential $cred -WorkingDirectory $scratch -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -Wait -PassThru
            # An unreadable exit code must never read as success.
            try { $childCode = $proc.ExitCode } catch { $childCode = $null }

            foreach ($logFile in @($stdoutLog, $stderrLog)) {
              Write-Host "===== $(Split-Path -Leaf $logFile) ====="
              if (Test-Path -LiteralPath $logFile) {
                Get-Content -LiteralPath $logFile | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host '(no such file)'
              }
              Write-Host "===== end $(Split-Path -Leaf $logFile) ====="
            }
          } finally {
            # Reparse points FIRST, before ANY recursive pass over either tree.
            # Confirmed windows-latest defect: the recursive icacls /remove:g /T
            # below used to run while junctions created under the scratch tree
            # still existed, and icacls /T follows them -- CI logs show the
            # traversal escaping through a root link to out-of-tree targets
            # (System Volume Information access errors). A link that no longer
            # exists cannot be recursed through. A tree whose links cannot all
            # be removed gets NO recursive pass at all (no icacls /T, no
            # Remove-Item -Recurse): the leftover link is recorded as a teardown
            # failure instead of walking outside the tree. Unrelated steps
            # (account/profile deletion) keep their best-effort semantics.
            $checkoutLinks = @()
            if (-not [string]::IsNullOrWhiteSpace($checkout) -and (Test-Path -LiteralPath $checkout)) {
              $checkoutLinks = @(Get-RemainingReparsePoints $checkout)
              foreach ($rp in $checkoutLinks) { $cleanupFailures += "reparse point $($rp.FullName) under the checkout could not be removed; recursive passes on the checkout were skipped" }
            }
            $scratchLinks = @()
            if ($scratchCreated -and (Test-Path -LiteralPath $scratch)) {
              $scratchLinks = @(Get-RemainingReparsePoints $scratch)
              foreach ($rp in $scratchLinks) { $cleanupFailures += "reparse point $($rp.FullName) under the scratch root could not be removed; recursive passes on the scratch root were skipped" }
            }

            # Order matters: strip the links, revoke the ACEs while the SID is
            # still meaningful, THEN delete the account, THEN the profile and
            # the scratch root. `icacls` is a native command -- its failure is
            # an exit code, not a terminating error, so every call is checked
            # explicitly instead of relying on `catch`.
            if ($accountSid) {
              $aceTargets = @()
              if ($checkoutLinks.Count -eq 0 -and -not [string]::IsNullOrWhiteSpace($checkout) -and (Test-Path -LiteralPath $checkout)) { $aceTargets += $checkout }
              if ($scratchCreated -and $scratchLinks.Count -eq 0 -and (Test-Path -LiteralPath $scratch)) { $aceTargets += $scratch }
              foreach ($target in $aceTargets) {
                icacls $target /remove:g "*$accountSid" /T /C /Q | Out-Null
                if ($LASTEXITCODE -ne 0) {
                  $cleanupFailures += "icacls /remove:g *$accountSid on $target exited $LASTEXITCODE"
                } else {
                  Write-Host "[lowpriv] teardown: revoked *$accountSid on $target"
                }
              }
            } elseif ($created) {
              $cleanupFailures += "no SID was captured for $account; its ACEs could not be revoked by SID"
            }

            if ($created) {
              try {
                if ($accountSid) {
                  Remove-LocalUser -SID ([System.Security.Principal.SecurityIdentifier]$accountSid)
                } else {
                  Remove-LocalUser -Name $account
                }
                Write-Host "[lowpriv] teardown: removed local account $account"
              } catch {
                $cleanupFailures += "Remove-LocalUser for $account failed: $($_.Exception.Message)"
              }

              $profileDir = "C:\Users\$account"
              if (Test-Path -LiteralPath $profileDir) {
                Remove-Item -LiteralPath $profileDir -Recurse -Force -ErrorAction SilentlyContinue
                if (Test-Path -LiteralPath $profileDir) { $cleanupFailures += "profile directory $profileDir is still present" }
              }
            }

            if ($scratchCreated) {
              # The links were already stripped at the top of this finally
              # block; the recursive delete runs only on a tree proven
              # link-free. With surviving links the failure is already recorded
              # and this recursive pass is skipped -- never run through a live
              # link.
              if ($scratchLinks.Count -eq 0) {
                Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
                if (Test-Path -LiteralPath $scratch) { $cleanupFailures += "scratch root $scratch is still present" }
              } else {
                Write-Host "[lowpriv] teardown: SKIPPED recursive removal of $scratch (reparse points survived link removal)"
              }
            }

            # The canary is the negative control for every recursive pass
            # above: after cleanup, the file's SHA-256 AND a fresh
            # `icacls /save` of the canary root+file must both be
            # byte-identical to the pre-cleanup baseline. A missing canary, a
            # changed hash, or a changed ACL snapshot means a recursive pass
            # escaped the scratch root and MODIFIED out-of-tree state -- always
            # a step failure, never a warning.
            if ($canaryCreated) {
              $canaryOk = $true
              if (-not (Test-Path -LiteralPath $canaryFile)) {
                $cleanupFailures += 'out-of-tree canary is missing: a recursive pass escaped the scratch root'
                $canaryOk = $false
              } else {
                $canaryHashAfter = (Get-FileHash -LiteralPath $canaryFile -Algorithm SHA256).Hash
                if ($canaryHashAfter -ne $canaryHashBefore) {
                  $cleanupFailures += "out-of-tree canary content hash changed (expected $canaryHashBefore, got $canaryHashAfter): a recursive pass escaped the scratch root"
                  $canaryOk = $false
                }
                $canaryAclAfterFile = Join-Path $env:RUNNER_TEMP "byok-lowpriv-canary-$runTag-acl-after-file.acl"
                $canaryAclAfterDir = Join-Path $env:RUNNER_TEMP "byok-lowpriv-canary-$runTag-acl-after-dir.acl"
                icacls $canaryFile /save $canaryAclAfterFile /Q | Out-Null
                $canaryAclFileExit = $LASTEXITCODE
                icacls $canary /save $canaryAclAfterDir /Q | Out-Null
                $canaryAclDirExit = $LASTEXITCODE
                if ($canaryAclFileExit -ne 0 -or $canaryAclDirExit -ne 0) {
                  $cleanupFailures += "out-of-tree canary ACL re-read exited file=$canaryAclFileExit dir=$canaryAclDirExit; out-of-tree ACL preservation is unprovable"
                  $canaryOk = $false
                } elseif ([string]::IsNullOrWhiteSpace($canaryAclBeforeFile) -or -not (Test-Path -LiteralPath $canaryAclBeforeFile) -or [string]::IsNullOrWhiteSpace($canaryAclBeforeDir) -or -not (Test-Path -LiteralPath $canaryAclBeforeDir)) {
                  $cleanupFailures += "pre-cleanup canary ACL baselines $canaryAclBeforeDir + $canaryAclBeforeFile are missing; out-of-tree ACL preservation is unprovable"
                  $canaryOk = $false
                } else {
                  $aclFileHashBefore = (Get-FileHash -LiteralPath $canaryAclBeforeFile -Algorithm SHA256).Hash
                  $aclFileHashAfter = (Get-FileHash -LiteralPath $canaryAclAfterFile -Algorithm SHA256).Hash
                  $aclDirHashBefore = (Get-FileHash -LiteralPath $canaryAclBeforeDir -Algorithm SHA256).Hash
                  $aclDirHashAfter = (Get-FileHash -LiteralPath $canaryAclAfterDir -Algorithm SHA256).Hash
                  if ($aclFileHashBefore -ne $aclFileHashAfter -or $aclDirHashBefore -ne $aclDirHashAfter) {
                    $cleanupFailures += "out-of-tree canary ACL snapshot changed: a recursive pass rewrote out-of-tree ACLs"
                    $canaryOk = $false
                  }
                }
              }
              if ($canaryOk) {
                Write-Host '[lowpriv] teardown: out-of-tree canary content hash AND ACL snapshot byte-identical; no recursive pass left the scratch root'
              }
              Remove-Item -LiteralPath $canary -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $canary) { $cleanupFailures += "canary root $canary is still present" }
            }

            foreach ($failure in $cleanupFailures) { Write-Host "[lowpriv] teardown FAILED: $failure" }
          }

          # Never report success without a real exit code from the standard-user child.
          if ($null -eq $childCode) { throw 'the standard-user child exit code could not be read; refusing to report success' }
          Write-Host "[lowpriv] standard-user child exited with $childCode"
          # A failed main run keeps its own exit code (the teardown failures above are
          # already printed). A clean main run with a failed teardown is not a pass.
          if ($childCode -eq 0 -and $cleanupFailures.Count -gt 0) {
            Write-Host "[lowpriv] the run itself passed but $($cleanupFailures.Count) teardown step(s) failed; failing the step"
            exit 70
          }
          exit $childCode

      # The release driver's --artifacts mode publishes exactly the bytes this job
      # accepted, so one leg has to hand them out. Ubuntu only: three legs would be
      # three name collisions, and one accepted set is the point.
      - name: Retain the accepted release tarballs for the publish driver
        if: matrix.os == 'ubuntu-latest' && needs.select.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-pack-${{ github.sha }}
          path: .ci-artifacts/release-pack
          if-no-files-found: error
          retention-days: 30

  # Tier 2 of the release-asset guarantee. `npm-release-pack` above is the hard
  # gate and is deliberately service-free: it proves the cloud-dataplane tarball
  # carries `deploy/sql` byte-for-byte under `dist/sql/` and that an isolated
  # install can resolve `migrationsDir()`. What it cannot prove without a
  # database is that those files actually migrate one -- so that runs here,
  # against a Postgres service container, from the SAME tarballs the pack step
  # produced (read back out of the release manifest, never repacked).
  #
  # Distinct from the `dataplane` job above, which runs this repo's suites
  # against a source checkout: nothing in this job's migrate path touches
  # `deploy/sql`, because a consumer installing from npm has no checkout. A
  # service container is enough here (unlike the compose file the dataplane job
  # needs) because migrating needs Postgres and nothing else.
  #
  # The database starts empty on every run, which is what makes the first-run
  # assertion "every shipped migration was applied" mean something, and the
  # second run pins idempotence plus the runner's checksum verification.
  release-pack-migrate:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'release-pack-migrate') }}
    name: migrate empty and v0.4.2 Postgres fixtures from packed tarballs (fixed Node)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: byok
          POSTGRES_PASSWORD: byok
          POSTGRES_DB: byok_release_smoke
        ports:
          - 5432:5432
        # Without this the steps below can reach a container that is up but not
        # yet accepting connections.
        options: >-
          --health-cmd "pg_isready -U byok -d byok_release_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://byok:byok@127.0.0.1:5432/byok_release_smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # pg-migrate-smoke verifies frozen migration bytes directly from tag v0.4.2

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup release helper Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod

      - name: Install dependencies
        run: bun ci

      - name: Install isolated credential-provider dependencies on Linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools

      - name: Pack the exact tarballs a consumer would install
        run: bash scripts/ci/with-secret-service.sh bun run check:release-pack -- --out-dir .ci-artifacts/release-pack

      - name: Prove empty install and v0.4.2-to-candidate upgrade from packed tarballs
        run: node scripts/release/pg-migrate-smoke.mjs --artifacts .ci-artifacts/release-pack

  # M3-4 Windows Service guarantee: proves the generated WinSW service
  # descriptor (packages/client/src/lifecycle/winsw.ts) actually installs,
  # runs, stops, restarts, and uninstalls as a REAL Windows Service via the
  # real Windows SCM -- this is the one platform in M3-4's lifecycle API
  # (launchd/systemd/WinSW) that cannot be verified on this repo's own
  # macOS/Linux dev machines, so this job (not a local run) is the actual
  # proof. See templates/service/winsw/{README.md,smoke-test.mjs} for the
  # full recipe + rationale -- this job just runs that same script, the
  # same way `packageability-smoke` above runs templates/packaging's own
  # smoke-test.sh.
  #
  # Deliberately independent of build-test/packageability-smoke above (no
  # `needs:`): its own install + build, so it can be extended/reordered
  # later without perturbing either of those.
  #
  # WinSW-x64.exe is a self-contained .NET single-file executable (no
  # separate .NET runtime install needed on the runner) -- pinned to an
  # immutable release version and SHA256-verified before it is executed, so
  # an upstream release cannot silently change what CI installs and runs.
  windows-service-smoke:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'windows-service-smoke') }}
    name: Windows service install smoke (WinSW)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build (needed for @byok-sdk/client's dist/index.js the smoke script imports)
        run: bun run build

      - name: Download WinSW (pinned version + checksum-verified)
        shell: pwsh
        run: |
          # Pinned to an immutable release asset (not `latest`) and integrity-checked,
          # so an upstream release can never silently change what CI installs+runs.
          $ver = "v2.12.0"
          $sha = "05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da"
          $out = "$env:RUNNER_TEMP\WinSW.exe"
          Invoke-WebRequest -Uri "https://github.com/winsw/winsw/releases/download/$ver/WinSW-x64.exe" -OutFile $out
          $actual = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          if ($actual -ne $sha) { Write-Error "WinSW checksum mismatch: expected $sha, got $actual"; exit 1 }
          Write-Host "WinSW $ver checksum OK"

      - name: Run the WinSW service lifecycle smoke (install -> assert RUNNING -> stop -> start -> uninstall)
        env:
          WINSW_BIN: ${{ runner.temp }}\WinSW.exe
        run: node templates/service/winsw/smoke-test.mjs

  # M4 Phase 2 daemon control socket guarantee: proves the local IPC control
  # socket (Unix domain socket on macOS/Linux, a named pipe on Windows --
  # packages/client/src/daemon/control-server.ts,
  # packages/client/src/daemon/control-protocol.ts) actually works
  # end-to-end through the REAL packaged `byok-agent` CLI, on all three
  # OSes -- not just the in-process unit/integration tests already covered
  # by `bun run test` above (packages/client/src/__tests__/control-*.test.ts,
  # daemon-control-socket.test.ts). Starts a real `byok-agent start` child
  # process (paired against a real, ephemeral `@byok-sdk/server` this script
  # also boots), reaches it live via a SEPARATE `byok-agent status`
  # invocation, then performs a real live `byok-agent unpair --yes` and
  # confirms the daemon process actually exits on its own -- the exact
  # "must not leave the process hanging" guarantee this feature exists to
  # provide. See packages/client/scripts/ipc-smoke.mjs for the full script.
  #
  # Deliberately independent of build-test/packageability-smoke/
  # windows-service-smoke above (no `needs:`): its own install + build, so
  # it can be extended/reordered later without perturbing any of those.
  ipc-smoke:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'ipc-smoke') }}
    name: IPC control socket smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Install ephemeral Secret Service dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus-x11 gnome-keyring libsecret-tools

      - name: Build (needed for @byok-sdk/client + @byok-sdk/server dist/ this script drives)
        run: bun run build

      - name: Inspect bounded Windows credential runtime facts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vault = Get-Service -Name VaultSvc -ErrorAction SilentlyContinue
          $vaultState = if ($null -eq $vault) { "missing" } else { $vault.Status.ToString().ToLowerInvariant() }
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          $interactive = [Environment]::UserInteractive.ToString().ToLowerInvariant()
          Write-Host "windows-credential-runtime vaultsvc=$vaultState session_id=$sessionId interactive=$interactive"

      - name: Probe native Windows Credential Manager
        if: runner.os == 'Windows'
        env:
          BYOK_NATIVE_WINDOWS_CREDENTIAL_SMOKE: '1'
        run: bun run --filter @byok-sdk/client test -- src/__tests__/device-credential-store.native.test.ts

      - name: Run the IPC control socket smoke
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            keyring_home="$RUNNER_TEMP/byok-ipc-keyring-home"
            mkdir -p "$keyring_home"
            chmod 700 "$keyring_home"
            env HOME="$keyring_home" dbus-run-session -- bash -euo pipefail -c '
              printf "%s" "byok-ci-ephemeral" | gnome-keyring-daemon --unlock >/dev/null
              gnome-keyring-daemon --start --components=secrets >/dev/null
              node packages/client/scripts/ipc-smoke.mjs
            '
          else
            node packages/client/scripts/ipc-smoke.mjs
          fi

      # M5 pilot: credential-isolation audit. The client audit command owns the
      # exact adapter smoke and runs it under Linux strace; this leg supplies the
      # kernel-level evidence that macOS cannot provide without root/SIP workarounds.
      # It is intentionally separate from the existing jobs and emits no secrets.
  credential-isolation-audit:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'credential-isolation-audit') }}
    name: credential isolation audit (Ubuntu, strace)
    runs-on: ubuntu-latest
    env:
      AUDIT_ROOT: ${{ github.workspace }}/.ci-artifacts/credential-isolation
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Install strace
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends strace

      - name: Build (needed by the adapter smoke)
        run: bun run build

      - name: Run credential-isolation audit
        run: |
          mkdir -p "$AUDIT_ROOT/raw"
          bun run --filter @byok-sdk/client audit:credentials -- \
            --trace-dir "$AUDIT_ROOT/raw" \
            --summary "$AUDIT_ROOT/summary.json"

      - name: Upload credential-isolation audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-isolation-audit
          path: ${{ github.workspace }}/.ci-artifacts/credential-isolation
          if-no-files-found: warn

  # #608: the Hermes adapter against a real Hermes on Windows. The qualified
  # build (`QUALIFIED_HERMES_VERSION` in
  # packages/client/src/adapters/hermes/hermes-version.ts) is installed with
  # Hermes's own installer, fetched at that commit and checksum-verified, so an
  # upstream change cannot alter what CI installs. The model is a local fake
  # OpenAI-compatible endpoint inside the test: no paid call, no provider key.
  # Its own job, because the install takes minutes and only Hermes paths select it.
  hermes-real-windows:
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.families), 'hermes-real-windows') }}
    name: Hermes adapter against real Hermes on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build client dependencies
        run: bun run build

      - name: Install the qualified Hermes (pinned commit, checksum-verified installer)
        run: |
          $commit = "0b10b9f8155a7ecadd8c540b87712c791b5c8ac9"
          $sha = "3d428ce54dea5fe26f8f52e40b2a49876d3cb95c49760e8350d6458046519479"
          $installer = Join-Path $env:RUNNER_TEMP "hermes-install.ps1"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/NousResearch/hermes-agent/$commit/scripts/install.ps1" -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($actual -ne $sha) { Write-Error "Hermes installer checksum mismatch: expected $sha, got $actual"; exit 1 }
          # The install's own home, apart from the SDK root the test creates.
          $hermesHome = Join-Path $env:RUNNER_TEMP "hermes-install-home"
          $started = Get-Date
          pwsh -NoProfile -File $installer -Commit $commit -NonInteractive -SkipBrowser -SkipComputerUse `
            -HermesHome $hermesHome -InstallDir (Join-Path $env:RUNNER_TEMP "hermes-agent")
          if ($LASTEXITCODE -ne 0) { Write-Error "Hermes install failed ($LASTEXITCODE)"; exit 1 }
          Write-Host "Hermes install took $([int]((Get-Date) - $started).TotalSeconds) s"
          $bin = Join-Path $hermesHome "bin\hermes.exe"
          if (-not (Test-Path $bin)) { Get-ChildItem (Join-Path $hermesHome "bin") | Format-Table Name, Length; Write-Error "no $bin"; exit 1 }
          $env:HERMES_HOME = $hermesHome
          & $bin --version
          if ($LASTEXITCODE -ne 0) { Write-Error "hermes --version failed ($LASTEXITCODE)"; exit 1 }
          "BYOK_HERMES_REAL_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the Hermes adapter against real Hermes with a fake model endpoint
        run: |
          # The test skips without this variable; never let a missing install pass as a skip.
          if (-not (Test-Path $env:BYOK_HERMES_REAL_BIN)) { Write-Error "BYOK_HERMES_REAL_BIN is not set to the installed Hermes"; exit 1 }
          bun run --filter @byok-sdk/client test -- src/__tests__/hermes-real.test.ts

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: ["select", "targeted", "build-test", "agent-memory-export-linux", "agent-memory-helper-non-darwin", "agent-memory-helper", "execution-recovery-native", "adapter-lifecycle-smoke", "dataplane", "windows-git-workspace", "packageability-smoke", "npm-release-pack", "release-pack-migrate", "windows-service-smoke", "ipc-smoke", "credential-isolation-audit", "hermes-real-windows"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Require the selected scope, with the complete inventory on release
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.select.outputs.plan }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
        run: node scripts/ci/require-ci-plan.mjs
