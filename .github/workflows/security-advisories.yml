name: Security advisories

on:
  schedule:
    - cron: '17 21 * * *' # Daily, 05:17 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-advisories-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Scan lockfile and canonical vendor provenance
        run: node scripts/ci/security-advisories.mjs
      - name: Publish scan summary
        if: always()
        run: |
          if [ -f security-advisories-report/summary.md ]; then
            cat security-advisories-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'SCAN ERROR: advisory report was not produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Retain report on findings and scan errors
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-advisories-${{ github.run_id }}
          path: |
            security-advisories-report/*.json
            security-advisories-report/*.log
            security-advisories-report/*.md
          if-no-files-found: error
          retention-days: 30
