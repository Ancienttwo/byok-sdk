# DIAG #1373 -- do not merge. One run as the hosted runner account (runneradmin), as the
# packaging consistency job runs: whoami SID/RID, the SDDL of a client-hardened projection
# directory, and the #1396 launcher check's error. Checks out #1396's head as `src`.
name: diag-1373-admin
on:
  push:
    branches: [diag/1373-native-acl]
    paths: [.github/workflows/diag-1373-admin.yml, .github/diag-1373/admin-probe.ts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: "diag-1373 runneradmin projection ACL"
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 31b5debc56605b41a0232bdf0fb5cda44b2e7d0d
          path: src
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Account
        shell: cmd
        run: |
          whoami /user /fo csv /nh
          whoami /groups /fo csv /nh | findstr /i "S-1-5-32-544 S-1-16"
      - run: cd src && bun ci && bun run --filter @byok-sdk/core build
      - name: Probe
        run: cd src && bun ../.github/diag-1373/admin-probe.ts
