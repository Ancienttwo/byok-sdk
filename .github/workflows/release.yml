name: Release

# Publishes the release train to npm through npm trusted publishing (OIDC) with
# provenance, so a release needs no npm token and no per-package 2FA prompt.
# Setup, owner steps and constraints: docs/releases/oidc-trusted-publishing.md.
#
# npm accepts trusted publishing from GitHub-hosted runners only. A self-hosted
# runner cannot mint the OIDC identity npm trusts, so this job must stay on
# ubuntu-latest; scripts/release/publish.mjs refuses any other runner.
#
# Every publication, including local OTP execution, must consume the exact CI
# archive identified by the explicit run/artifact/digest inputs. publish.mjs
# independently checks GitHub metadata and downloads/authenticates the archive.
# No rebuild or local evidence receipt can authorize execution.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit on main to release. The run refuses any other commit.
        type: string
        required: true
      ci-run-id:
        description: Successful ci.yml workflow_dispatch run for this exact SHA on main or release/*.
        type: string
        required: true
      ci-artifact-id:
        description: ID of that run's unexpired release-pack-<sha> artifact.
        type: string
        required: true
      ci-artifact-digest:
        description: Exact sha256:<hex> digest from the GitHub artifact API.
        type: string
        required: true
      execute:
        description: Publish for real. Leave unchecked to print the full release plan only.
        type: boolean
        default: false
      dist-tag:
        description: npm dist-tag for a prerelease (for example rc). Leave empty for a stable release.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: npm trusted publishing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment name. Its protection
    # rules (owner review, main only) are the approval step for every release.
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Refuse a commit other than the approved one
        env:
          APPROVED_SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_SHA" != "$APPROVED_SHA" ]; then
            echo "::error::this run is at $GITHUB_SHA, the approved commit is $APPROVED_SHA"
            exit 1
          fi

      - name: Checkout with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup fixed Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # npm provenance identifies this release workflow SHA. The evidence records
      # the separate CI build identity; never override GITHUB_SHA or rebuild bytes.
      - name: Verify accepted CI artifact and release plan or publish
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci-run-id }}
          CI_ARTIFACT_ID: ${{ inputs.ci-artifact-id }}
          CI_ARTIFACT_DIGEST: ${{ inputs.ci-artifact-digest }}
          EXECUTE: ${{ inputs.execute }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=(--trusted-publishing --ci-run-id "$CI_RUN_ID" --ci-artifact-id "$CI_ARTIFACT_ID" --ci-artifact-digest "$CI_ARTIFACT_DIGEST")
          if [ -n "$DIST_TAG" ]; then args+=(--tag "$DIST_TAG"); fi
          if [ "$EXECUTE" = 'true' ]; then args+=(--execute); else args+=(--dry-run); fi
          node scripts/release/publish.mjs "${args[@]}"

      - name: Preserve verified build and release workflow identities
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error

      - name: Push the release tag
        if: inputs.execute
        run: |
          tag="v$(node -p "require('./packages/core/package.json').version")"
          git push origin "refs/tags/$tag"
