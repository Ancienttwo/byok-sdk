name: Release

# Publishes the release train to npm through npm trusted publishing (OIDC) with
# provenance, so a release needs no npm token and no per-package 2FA prompt.
# Setup, owner steps and constraints: docs/releases/oidc-trusted-publishing.md.
#
# npm accepts trusted publishing from GitHub-hosted runners only. A self-hosted
# runner cannot mint the OIDC identity npm trusts, so this job must stay on
# ubuntu-latest; scripts/release/publish.mjs refuses any other runner.
#
# The job publishes the exact tarballs that CI accepted for this commit: it finds
# the successful ci.yml push run for github.sha (a pull_request run names its
# artifact after the merge ref, not this commit), downloads its
# release-pack-<sha> artifact, and hands it to publish.mjs --artifacts, which
# re-hashes every tarball against the frozen release-manifest.json. Nothing is
# built or packed here.
#
# The `sha` input pins the approved commit: a dispatch whose main tip has moved
# refuses to run, so a plan is never released from code nobody reviewed.
#
# Re-running the original run (`gh run rerun <id>`) is the recovery path. publish.mjs
# skips versions already on the registry with the frozen bytes, resumes from the
# first unpublished package, and, when every package is published but the tag is
# missing, resumes with the readback and the tag.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit on main to release. The run refuses any other commit.
        type: string
        required: true
      execute:
        description: Publish for real. Leave unchecked to print the full release plan only.
        type: boolean
        default: false
      dist-tag:
        description: npm dist-tag for a prerelease (for example rc). Leave empty for a stable release.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: npm trusted publishing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment name. Its protection
    # rules (owner review, main only) are the approval step for every release.
    environment: npm-release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Refuse a commit other than the approved one
        env:
          APPROVED_SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_SHA" != "$APPROVED_SHA" ]; then
            echo "::error::this run is at $GITHUB_SHA, the approved commit is $APPROVED_SHA"
            exit 1
          fi

      - name: Checkout with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup fixed Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::no successful ci.yml push run for $GITHUB_SHA on main; wait for CI to pass on this commit"
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the accepted release tarballs
        uses: actions/download-artifact@v4
        with:
          name: release-pack-${{ github.sha }}
          path: ${{ runner.temp }}/release-pack
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Release plan or publish
        env:
          EXECUTE: ${{ inputs.execute }}
          DIST_TAG: ${{ inputs.dist-tag }}
          ARTIFACTS: ${{ runner.temp }}/release-pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=(--trusted-publishing --artifacts "$ARTIFACTS")
          if [ -n "$DIST_TAG" ]; then args+=(--tag "$DIST_TAG"); fi
          if [ "$EXECUTE" = 'true' ]; then args+=(--execute); else args+=(--dry-run); fi
          node scripts/release/publish.mjs "${args[@]}"

      - name: Push the release tag
        if: inputs.execute
        run: |
          tag="v$(node -p "require('./packages/core/package.json').version")"
          git push origin "refs/tags/$tag"
