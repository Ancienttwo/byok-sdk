name: Windows memory platform-refusal checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-platform-refusal:
    name: Windows platform refusal and flush diagnostics (${{ matrix.runtime }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/client/native/agent-memory-fs/go.mod
      - name: Record host profile (no containment or S proof)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .ci-artifacts/wo09 | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List | Out-File .ci-artifacts/wo09/profile.txt
          Get-Volume | Select-Object DriveLetter,FileSystem,UniqueId,DriveType | Format-List | Out-File -Append .ci-artifacts/wo09/profile.txt
          whoami /all | Out-File -Append .ci-artifacts/wo09/profile.txt
          if ($LASTEXITCODE -ne 0) { throw 'whoami failed' }
          'Hosted token and storage profile are observations. Process kills test model P only. OS-crash and power-loss recovery remain unproved.' | Out-File -Append .ci-artifacts/wo09/profile.txt
      - name: Check platform refusal, identity parity, NTFS directory barrier and process-kill recovery; collect flush diagnostics
        working-directory: packages/client/native/agent-memory-fs
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = 'go1.26.5'
          $env:BYOK_TEST_AGENT_MEMORY_JS_RUNTIME = (Get-Command '${{ matrix.runtime }}').Source
          go test -v ./... 2>&1 | Tee-Object ../../../../.ci-artifacts/wo09/go.txt
          if ($LASTEXITCODE -ne 0) { throw 'native Windows tests failed' }
          go build -buildvcs=false -trimpath -o "$env:RUNNER_TEMP/byok-agent-memory-fs.exe" .
          if ($LASTEXITCODE -ne 0) { throw 'helper build failed' }
          go test -c -o "$env:RUNNER_TEMP/agent-memory-fs-tests.exe" .
          if ($LASTEXITCODE -ne 0) { throw 'test binary build failed' }
      - name: Check NTFS directory barrier and process-kill recovery as a standard user
        shell: pwsh
        run: |
          # The runner token is an administrator. A new local account in Users
          # only runs the same test binary, so the barrier is not admin-only.
          $user = 'byokntfs'
          # net user prompts for confirmation above 14 characters.
          $password = 'Aa1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          net user $user $password /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'standard user creation failed' }
          $work = Join-Path $env:RUNNER_TEMP 'standard-user'
          New-Item -ItemType Directory -Force (Join-Path $work 'tmp') | Out-Null
          Copy-Item "$env:RUNNER_TEMP/agent-memory-fs-tests.exe" $work
          icacls $work /grant "${user}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'work directory grant failed' }
          @(
            '@echo off'
            "set TMP=$work\tmp"
            "set TEMP=$work\tmp"
            "whoami /all > `"$work\token.txt`""
            "`"$work\agent-memory-fs-tests.exe`" -test.v -test.count=1 -test.run `"^(TestWindowsMemoryResultBarrierFailsClosedOnNTFS|TestWindowsProcessKillAtEachBarrierPointOnNTFS|TestWindowsProcessKillAtRandomTimesOnNTFS)$`" > `"$work\go.txt`" 2>&1"
            'exit /b %ERRORLEVEL%'
          ) | Set-Content -Encoding ascii (Join-Path $work 'run.cmd')
          $credential = [pscredential]::new($user, (ConvertTo-SecureString $password -AsPlainText -Force))
          $process = Start-Process -FilePath (Join-Path $work 'run.cmd') -Credential $credential -WorkingDirectory $work -Wait -PassThru
          Copy-Item (Join-Path $work 'token.txt') .ci-artifacts/wo09/standard-user-token.txt -ErrorAction SilentlyContinue
          Copy-Item (Join-Path $work 'go.txt') .ci-artifacts/wo09/standard-user-go.txt -ErrorAction SilentlyContinue
          Get-Content (Join-Path $work 'token.txt')
          Get-Content (Join-Path $work 'go.txt')
          $token = Get-Content -Raw (Join-Path $work 'token.txt')
          if ($token -notmatch "\\$user\b") { throw 'test did not run as the standard user' }
          if ($token -match 'S-1-5-32-544') { throw 'standard user token holds Administrators' }
          if ($process.ExitCode -ne 0) { throw "standard-user tests failed: exit $($process.ExitCode)" }
          # A renamed test would match nothing and still exit 0.
          $output = Get-Content -Raw (Join-Path $work 'go.txt')
          if ($output -match '--- FAIL') { throw 'standard-user tests reported a failure' }
          foreach ($name in 'TestWindowsMemoryResultBarrierFailsClosedOnNTFS', 'TestWindowsProcessKillAtEachBarrierPointOnNTFS', 'TestWindowsProcessKillAtRandomTimesOnNTFS') {
            if ($output -notmatch "--- PASS: $name \(") { throw "standard-user run did not pass $name" }
          }
      - name: Check platform refusal with empty env and junction fixtures
        shell: pwsh
        run: |
          & '${{ matrix.runtime }}' scripts/ci/agent-memory-windows-denial.mjs "$env:RUNNER_TEMP/byok-agent-memory-fs.exe" 2>&1 | Tee-Object .ci-artifacts/wo09/runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'runtime platform-refusal check failed' }
      - name: Install and build TypeScript packages
        shell: pwsh
        run: |
          bun ci
          if ($LASTEXITCODE -ne 0) { throw 'dependency install failed' }
          bun run build
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript build failed' }
      - name: Check TypeScript identity and closed Windows gate
        run: bun run --filter @byok-sdk/client test -- src/__tests__/agent-memory-helper-identity.test.ts src/__tests__/agent-memory-windows-gate.test.ts
      - name: Keep diagnostics (not containment or S acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wo09-windows-${{ matrix.runtime }}-${{ github.sha }}
          path: .ci-artifacts/wo09
          if-no-files-found: error
